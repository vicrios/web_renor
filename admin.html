<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin - RENOR</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header class="navbar">
  <div class="header-container">
    <div class="logo-container">
      <img src="imagenes/logo.png" alt="Logo RENOR" class="logo-img">
      <div class="logo-text"><h1>RENOR - Administración</h1></div>
    </div>
    <button class="btn-cuenta" id="btn-logout">Cerrar Sesión</button>
  </div>
</header>

<section class="panel-section">
  <h2 style="color:#ff5555;margin-bottom:1rem;">Gestión de Solicitudes y Pedidos</h2>
  <table>
    <thead>
      <tr><th>Folio</th><th>Tipo</th><th>Especificaciones</th><th>Cliente</th><th>Contacto</th><th>Precio</th><th>Estatus</th><th></th></tr>
    </thead>
    <tbody id="tabla"></tbody>
  </table>
</section>

<script src="js/admin.js"></script>
</body>
</html>
